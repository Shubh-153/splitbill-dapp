<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SplitBill DApp</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #6366f1;
    --accent2: #22c55e;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --error: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, var(--bg), #1a2540);
    color: var(--text);
    min-height: 100vh;
    padding: 24px;
  }
  .container { max-width: 720px; margin: 0 auto; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
  }
  h1 { font-size: 1.6rem; margin: 0; }
  h1 span { color: var(--accent); }
  .wallet-info { text-align: right; font-size: 0.85rem; color: var(--muted); }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 0.95rem;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.5; cursor: default; }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 16px;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .card.settled { border-color: var(--accent2); }
  .card h3 { margin: 0 0 6px 0; }
  .meta { color: var(--muted); font-size: 0.85rem; margin: 4px 0 10px 0; }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    border-top: 1px solid rgba(255,255,255,0.05);
    font-size: 0.9rem;
    gap: 10px;
  }
  li button { padding: 4px 10px; font-size: 0.8rem; background: var(--accent2); }
  form.card label { display: block; margin-bottom: 4px; font-size: 0.85rem; color: var(--muted); }
  form.card input {
    width: 100%;
    padding: 9px 10px;
    margin-bottom: 14px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.15);
    background: #0f172a;
    color: var(--text);
    font-size: 0.9rem;
  }
  .status {
    margin: 14px 0;
    padding: 10px 14px;
    border-radius: 8px;
    background: rgba(99, 102, 241, 0.15);
    color: var(--text);
    font-size: 0.85rem;
    min-height: 18px;
  }
  .status.error { background: rgba(248, 113, 113, 0.15); color: var(--error); }
  .section-title { margin: 28px 0 12px; display: flex; justify-content: space-between; align-items: center; }
  .section-title h2 { font-size: 1.1rem; margin: 0; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Split<span>Bill</span></h1>
    <div class="wallet-info">
      <div id="networkLabel">Not connected</div>
      <div id="accountLabel"></div>
    </div>
  </header>

  <button id="connectBtn">Connect Wallet</button>
  <div id="statusBox" class="status"></div>

  <form id="createForm" class="card">
    <h3>Create a bill</h3>
    <label for="description">Description</label>
    <input id="description" type="text" placeholder="e.g. Dinner at Cafe X" required />

    <label for="participants">Participant wallet addresses (comma-separated)</label>
    <input id="participants" type="text" placeholder="0xAbc..., 0xDef..." required />

    <label for="shares">Each participant's share in ETH, same order (comma-separated)</label>
    <input id="shares" type="text" placeholder="0.1, 0.2" required />

    <button type="submit">Create Bill</button>
  </form>

  <div class="section-title">
    <h2>Bills</h2>
    <button id="refreshBtn">Refresh</button>
  </div>
  <div id="billsList"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>
<script src="abi.js"></script>
<script src="app.js"></script>
</body>
</html>
